[project]
name = "elastic-scaling-poc"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/elastic_scaling_poc"]

[tool.uv.sources]
kubeflow = { git = "https://github.com/opendatahub-io/kubeflow-sdk.git", rev = "v0.3.0+rhaiv.2" }

[dependency-groups]
analysis = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
]
cluster = [
    "environs>=15.1.0",
    "kubeflow",
]
docs = [
    "matplotlib>=3.11.1",
    "myst-parser>=4.0.1",
    "sphinx>=9.1.0",
    "sphinx-rtd-theme>=3.1.0",
    "sphinxcontrib-mermaid>=2.1.0",
]
training = [
    "datasets>=5.0.1",
    "nvidia-ml-py>=13.610.43",
    "peft>=0.20.0",
    "torch>=2.13.0",
    "transformers>=5.15.0",
    "trl>=1.9.2",
]
